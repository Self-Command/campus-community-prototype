<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 官方认证</title>
  <link rel="stylesheet" href="campus-native.css">
  <link rel="stylesheet" href="campus-channel.css">
</head>
<body>
  <div class="app-shell">
    <main>
      <header class="appbar">
        <div class="appbar-left">
          <button class="icon-button" data-channel-link="campus-channel-manage.html" aria-label="返回">
            <svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          </button>
        </div>
        <div class="appbar-center"><strong>官方认证</strong></div>
        <div class="appbar-right"><span class="channel-tag ok" data-channel-certification>学生会认证</span></div>
      </header>

      <section class="page channel-page">
        <section class="channel-sheet">
          <div class="channel-block">
            <span class="channel-kicker">CERTIFICATION</span>
            <h1 class="channel-headline"><span data-channel-name>校学生会</span>官方认证</h1>
            <p class="channel-copy">认证只对垂直频道开放。这里看主体、材料、联系人和平台复核状态，不把材料塞在摘要页里。</p>
          </div>
        </section>

        <section class="channel-sheet">
          <div class="channel-form">
            <div class="channel-field"><label>认证状态</label><input value="学生会认证 · 补件中" readonly></div>
            <div class="channel-field"><label>认证主体</label><input value="校学生会"></div>
            <div class="channel-field"><label>归属单位</label><input value="计算机学院团委"></div>
            <div class="channel-field"><label>指导老师</label><input value="周老师"></div>
            <div class="channel-field"><label>联系电话</label><input value="138-0000-1208"></div>
            <div class="channel-field"><label>补件说明</label><textarea>平台要求补齐盖章授权页和指导老师联系方式，补件完成后再进入人工复核。</textarea></div>
          </div>
        </section>

        <section class="channel-sheet">
          <div class="channel-section-head">
            <div>
              <h2>材料清单</h2>
              <p>材料用线性列表展示，方便后端映射附件状态。</p>
            </div>
          </div>
          <div class="channel-row-list">
            <a class="channel-row no-icon" href="#">
              <div class="channel-row-main">
                <div class="channel-row-title">组织证明</div>
                <div class="channel-row-sub">当前已上传，等待平台复核。</div>
              </div>
              <div class="channel-row-tail"><span class="channel-tag ok">已上传</span></div>
            </a>
            <a class="channel-row no-icon" href="#">
              <div class="channel-row-main">
                <div class="channel-row-title">盖章授权页</div>
                <div class="channel-row-sub">本次补件重点，上传后进入平台复核。</div>
              </div>
              <div class="channel-row-tail"><span class="channel-tag warn">待补件</span></div>
            </a>
          </div>
        </section>

        <div class="channel-action-bar">
          <button class="button tertiary" type="button" data-action-toast="已打开补件上传">上传补件</button>
          <button class="button" type="button" data-action-toast="已提交平台复核">提交复核</button>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
  <script src="campus-channel-admin-data.js"></script>
  <script>
    (() => {
      const ctx = window.CampusChannelAdminData?.getContext();
      if (!ctx) return;
      window.CampusChannelAdminData.applyContext(document, ctx);
    })();
  </script>
</body>
</html>
