<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 发布求助</title>
  <link rel="stylesheet" href="campus-native.css">
  <link rel="stylesheet" href="campus-services.css">
</head>
<body>
  <div class="service-app" data-service-theme="help">
    <main>
      <header class="appbar"><div class="appbar-left"><button class="icon-button" data-nav="campus-help.html" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div><div class="appbar-center"><strong>发布求助</strong></div><div class="appbar-right"><button class="text-link" type="submit" form="help-form">提交</button></div></header>
      <form id="help-form" class="service-compose" data-submit-message="求助信息已提交审核" data-success-nav="campus-help.html" data-state-root>
        <p class="compose-note"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 3 20h18L12 3Z"/><path d="M12 9v4m0 4h.01"/></svg>写清时间、地点和预期帮助方式。求助到期或标记解决后会自动关闭公开入口。</p>
        <section class="compose-group"><div class="compose-group-label">求助内容</div><div class="compose-field"><label for="help-title">求助标题</label><input id="help-title" required maxlength="50" placeholder="例如：周五晚从东门拼车去高铁站"></div><div class="compose-field inline"><label for="help-type">求助类型</label><span class="field-control"><select id="help-type" required><option>学业互助</option><option>生活互助</option><option>拼车拼单</option><option>技能交换</option><option>物品借用</option><option>其他</option></select></span></div><div class="compose-field"><label for="help-detail">求助详情</label><textarea id="help-detail" required maxlength="500" placeholder="描述需求、时间、地点和需要注意的事项"></textarea></div></section>
        <section class="compose-group"><div class="compose-group-label">帮助方式</div><div class="compose-field inline"><label for="help-method">期望帮助方式</label><span class="field-control"><select id="help-method" required><option>线上指导</option><option>线下见面</option><option>无要求</option></select></span></div><div class="compose-field inline"><label for="expires">有效期</label><span class="field-control"><input id="expires" required type="datetime-local"></span></div><div class="compose-field inline"><label for="reward">报酬说明</label><span class="field-control"><input id="reward" placeholder="可选填写"></span></div><div class="compose-field"><label for="help-contact">联系方式</label><input id="help-contact" required placeholder="手机号或 QQ；公开时按规则脱敏"></div></section>
        <div class="compose-submitbar"><button class="button secondary" type="button" data-action-toast="草稿已保存">存草稿</button><button class="button" type="submit">提交审核</button></div>
      </form>
    </main>
  </div>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
  <script src="campus-services.js"></script>
</body>
</html>
