<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 失物招领</title>
  <link rel="stylesheet" href="campus-native.css">
  <link rel="stylesheet" href="campus-services.css">
</head>
<body>
  <div class="service-app" data-service-theme="lost">
    <main>
      <header class="appbar"><div class="appbar-left"><button class="icon-button" data-nav="campus-home.html" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div><div class="appbar-center"><strong>失物招领</strong></div><div class="appbar-right"><a class="text-link" href="campus-lost-found-publish.html">发布</a></div></header>
      <section class="service-page" data-state-root>
        <div class="service-search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><input data-list-search="#lost-list" data-empty-target="#lost-empty" placeholder="搜索物品、地点或时间"></div>
        <div class="service-chipbar" data-service-filter-group data-service-filter-target="#lost-list" aria-label="失物类型"><button class="service-chip active" data-service-filter="all" type="button">全部</button><button class="service-chip" data-service-filter="lost" type="button">寻物启事</button><button class="service-chip" data-service-filter="found" type="button">拾到物品</button><button class="service-chip" data-service-filter="card" type="button">证件</button><button class="service-chip" data-service-filter="key" type="button">钥匙</button><button class="service-chip" data-service-filter="digital" type="button">数码</button></div>
        <p class="section-caption">最新信息</p>
        <div class="service-list" id="lost-list">
          <a class="service-list-item" href="campus-lost-found-detail.html" data-searchable data-service-item="lost life"><span class="service-list-icon"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s7-4.6 7-11a7 7 0 1 0-14 0c0 6.4 7 11 7 11Z"/></svg></span><span class="service-list-copy"><h2>丢失：蓝色保温杯</h2><p>图书馆三楼自习区靠窗第二排，杯身有白色贴纸。</p><span class="service-list-meta"><span>昨天 18:20</span><span>图书馆三楼</span><span>林墨</span></span></span><span class="service-list-aside"><span class="svc-status warning">寻找中</span><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span></a>
          <a class="service-list-item" href="campus-lost-found-detail.html" data-searchable data-service-item="found card"><span class="service-list-icon"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8 9h8M8 13h5"/></svg></span><span class="service-list-copy"><h2>拾到：校园卡一张</h2><p>操场北门拾得，已交至后勤服务台，认领需核对本人信息。</p><span class="service-list-meta"><span>今天 08:10</span><span>操场北门</span><span>后勤服务台</span></span></span><span class="service-list-aside"><span class="svc-status">可认领</span><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span></a>
          <a class="service-list-item" href="campus-lost-found-detail.html" data-searchable data-service-item="found key"><span class="service-list-icon"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="15" r="3"/><path d="m11 13 6-6m-2-2 3 3m-5 1 2 2"/></svg></span><span class="service-list-copy"><h2>拾到：三把钥匙与门禁扣</h2><p>教学楼 B 座一层门口，可描述钥匙扣样式后联系发布者。</p><span class="service-list-meta"><span>今天 07:40</span><span>教学楼 B 座</span><span>沈乔</span></span></span><span class="service-list-aside"><span class="svc-status">可认领</span><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span></a>
        </div>
        <div class="empty" id="lost-empty" hidden><div class="empty-icon"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s7-4.6 7-11a7 7 0 1 0-14 0c0 6.4 7 11 7 11Z"/></svg></div><h3>没有匹配的物品信息</h3><p>试试更具体的颜色、地点或时间。</p></div>
      </section>
    </main>
  </div>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
  <script src="campus-services.js"></script>
</body>
</html>
