<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 登录</title>
  <link rel="stylesheet" href="campus-native.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-stage">
      <article class="auth-card">
        <span class="eyebrow">账号登录</span>
        <h1 class="auth-title">欢迎回来</h1>
        <p class="auth-subtitle">手机号是唯一登录账号。封禁、注销冻结期和待激活状态会在登录后立即拦截并给出原因。</p>
        <form class="inline-grid" data-submit-message="登录成功，正在进入首页" data-success-nav="campus-home.html">
          <div class="field"><label>手机号</label><input required inputmode="tel" pattern="^1[3-9]\d{9}$" placeholder="请输入注册手机号"></div>
          <div class="field input-wrap"><label>密码</label><input id="login-password" required type="password" minlength="8" maxlength="128" placeholder="请输入密码"><button class="trailing-button" type="button" data-toggle-password="#login-password" aria-label="显示密码">显示</button></div>
          <label class="state-strip"><input type="checkbox" checked style="margin-top:2px">记住登录设备 7 天；异常设备登录会二次校验</label>
          <div class="text-row"><a class="text-link" href="campus-forgot-password.html">忘记密码</a><a class="text-link" href="campus-register.html">新用户注册</a></div>
          <button class="button full" type="submit">登录</button>
        </form>
      </article>
      <article class="auth-card">
        <h3 style="margin:0 0 10px;font-size:16px">登录后状态说明</h3>
        <div class="detail-stack">
          <div class="success-strip"><svg class="i banner-icon" viewBox="0 0 24 24"><path d="m7 12 3 3 7-7"/><circle cx="12" cy="12" r="9"/></svg>ACTIVE：正常进入首页并同步未读通知、草稿、审核结果。</div>
          <div class="warning-strip"><svg class="i banner-icon" viewBox="0 0 24 24"><path d="M12 3 3 20h18L12 3Z"/><path d="M12 9v4m0 4h.01"/></svg>PENDING_ACTIVATION / PENDING_REVIEW：显示资料补齐或人工核验进度，不直接开放发布能力。</div>
          <div class="danger-strip"><svg class="i banner-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4m0 4h.01"/></svg>BANNED / CANCELLATION_PENDING：禁止进入主应用，展示原因、结束时间和申诉/撤销入口。</div>
        </div>
      </article>
    </section>
  </main>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
</body>
</html>
