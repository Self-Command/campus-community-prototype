<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 投递职位</title>
  <link rel="stylesheet" href="campus-native.css">
</head>
<body>
  <div class="app-shell">
    <main>
      <header class="appbar">
        <div class="appbar-left"><button class="icon-button" data-nav="campus-job-detail.html" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div>
        <div class="appbar-center"><strong>投递职位</strong></div>
        <div class="appbar-right"><button class="button" style="min-height:34px;padding:0 12px" form="job-apply-form" type="submit">提交</button></div>
      </header>

      <section class="page">
        <form id="job-apply-form" class="section-stack" data-submit-message="已提交岗位意向" data-success-nav="campus-jobs.html">
          <div class="detail-card">
            <h3>职位上下文</h3>
            <p>实验室助理 · 计算机学院实验中心。投递后平台会通知发布方；你的手机号只对招聘方可见，并记录访问日志。</p>
          </div>

          <div class="kv-grid">
            <div class="field"><label>姓名</label><input value="林墨" readonly></div>
            <div class="field"><label>手机号</label><input required placeholder="用于招聘方回联"></div>
          </div>

          <div class="field"><label>在校身份</label><select required><option value="">请选择</option><option>本科生</option><option>研究生</option><option>教职工</option></select></div>
          <div class="field"><label>可到岗时间</label><input required placeholder="例如：周一、周三、周五下午"></div>
          <div class="field"><label>个人说明</label><textarea required maxlength="300" placeholder="介绍你的时间安排、相关经历、可到岗日期和擅长事项"></textarea></div>
          <div class="field"><label>补充材料说明</label><textarea maxlength="180" placeholder="如有简历、作品集或导师推荐，可在这里写明材料名称"></textarea></div>

          <div class="info-strip"><svg class="i banner-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4m0 4h.01"/></svg>平台只负责信息流转，不做简历评分；招聘方保留申请记录和反馈状态由后台数据保留策略控制。</div>
        </form>
      </section>
    </main>
  </div>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
</body>
</html>
