<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>校园社区 · 通知设置</title><link rel="stylesheet" href="campus-native.css"><link rel="stylesheet" href="campus-personal.css"></head>
<body><div class="app-shell"><main>
  <header class="appbar"><div class="appbar-left"><button class="icon-button" data-nav="campus-account-settings.html" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div><div class="appbar-center"><strong>通知设置</strong></div><div class="appbar-right"></div></header>
  <section class="settings-page-clean">
    <section class="settings-group"><div class="settings-group-title">接收通知</div><div class="settings-row"><span><strong>互动通知</strong><small>点赞、评论、回复和收藏</small></span><button class="switch on" data-switch="notify-interaction" type="button" role="switch" aria-label="互动通知"><i></i></button></div><div class="settings-row"><span><strong>频道通知</strong><small>频道公告、入群审批与内容处理</small></span><button class="switch on" data-switch="notify-channel" type="button" role="switch" aria-label="频道通知"><i></i></button></div><div class="settings-row"><span><strong>活动提醒</strong><small>报名状态、递补、签到与活动变更</small></span><button class="switch on" data-switch="notify-activity" type="button" role="switch" aria-label="活动提醒"><i></i></button></div></section>
    <section class="settings-group"><div class="settings-group-title">免打扰</div><label class="settings-row"><span><strong>免打扰时间</strong><small>期间只保留紧急通知</small></span><select aria-label="免打扰时间"><option>关闭</option><option selected>23:00–07:00</option><option>22:00–08:00</option></select></label></section>
  </section>
</main></div><script src="campus-native.js"></script></body>
</html>
