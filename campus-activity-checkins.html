<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>校园社区 · 签到记录</title><link rel="stylesheet" href="campus-native.css"><link rel="stylesheet" href="campus-activity-admin.css"></head>
<body>
  <div class="app-shell"><main>
    <header class="appbar"><div class="appbar-left"><button class="icon-button" data-nav="campus-activity-manage.html" aria-label="返回活动管理"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div><div class="appbar-center"><strong>签到记录</strong></div><div class="appbar-right"><button class="text-action" type="button" data-activity-export="签到记录已导出，包含签到时间、方式与操作审计">导出</button></div></header>
    <section class="page activity-page" data-state-root>
      <header class="activity-context"><p class="activity-kicker">摄影社夜拍工作坊</p><h1>签到记录</h1><p>管理员可发起组合签到、查看实时名单、为缺席人员补签或撤销异常记录。</p></header>
      <section class="activity-live-checkin" aria-label="当前签到状态"><span><strong data-checkin-state>签到尚未开始</strong><small>可选择扫码、位置或拍照；签到方式可组合使用。</small></span><button class="button" type="button" data-open-activity-dialog="start-checkin-dialog">发起签到</button></section>
      <div class="activity-split-metrics"><span><strong>86 / 144</strong><small>已签到</small></span><span><strong>58</strong><small>尚未签到</small></span></div>
      <section class="activity-toolbar" data-activity-filter-root>
        <label class="activity-search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><input data-activity-search placeholder="搜索姓名或学号" aria-label="搜索签到人员"></label>
        <div class="activity-filter-row"><button class="activity-filter active" data-activity-filter="all">全部</button><button class="activity-filter" data-activity-filter="checked">已签到</button><button class="activity-filter" data-activity-filter="missing">未签到</button></div>
        <div class="activity-data-list" aria-label="签到人员列表">
          <button class="activity-person-row" data-activity-row data-activity-state="checked" data-activity-person="checkin-detail-dialog" data-person-name="林墨" data-person-status="已签到 · 19:12" data-person-meta="二维码签到 · 定位误差 8 米" data-person-extra="无异常 · 签到凭证已归档" data-person-row-id="checkin-linmo"><span class="activity-person-avatar">林</span><span class="activity-person-copy"><strong>林墨</strong><small>二维码 · 19:12 · 定位正常</small></span><span class="activity-status ok">已签到</span></button>
          <button class="activity-person-row" data-activity-row data-activity-state="missing" data-activity-person="checkin-detail-dialog" data-person-name="顾宁" data-person-status="未签到" data-person-meta="报名确认 · 候补已转正" data-person-extra="可补签，必须填写理由并写入审计" data-person-row-id="checkin-guning"><span class="activity-person-avatar">顾</span><span class="activity-person-copy"><strong>顾宁</strong><small>报名确认 · 暂无签到记录</small></span><span class="activity-status wait">未签到</span></button>
          <button class="activity-person-row" data-activity-row data-activity-state="checked" data-activity-person="checkin-detail-dialog" data-person-name="沈星" data-person-status="已签到 · 19:18" data-person-meta="拍照签到 · 人工抽检通过" data-person-extra="照片凭证可由管理员撤销，撤销必须说明原因" data-person-row-id="checkin-shenxing"><span class="activity-person-avatar">沈</span><span class="activity-person-copy"><strong>沈星</strong><small>拍照 · 19:18 · 抽检通过</small></span><span class="activity-status ok">已签到</span></button>
        </div>
      </section>
    </section>
  </main></div>
  <dialog id="start-checkin-dialog" class="activity-dialog"><form class="activity-dialog-body" data-activity-form data-activity-message="签到已开启，二维码与实时名单已生成" data-activity-target="[data-checkin-state]" data-activity-value="签到进行中 · 扫码 + 位置"><header class="activity-dialog-head"><h2>发起签到</h2><button type="button" data-close-activity-dialog="start-checkin-dialog" aria-label="关闭">×</button></header><div class="activity-field"><label for="checkin-method">签到方式</label><select id="checkin-method" required><option value="">请选择签到方式</option><option>扫码签到</option><option>位置签到</option><option>拍照签到</option><option>扫码 + 拍照</option></select></div><div class="activity-field"><label for="checkin-duration">有效时长（分钟）</label><input id="checkin-duration" type="number" min="5" max="180" value="30" required></div><button class="button full" type="submit">生成签到入口</button></form></dialog>
  <dialog id="checkin-detail-dialog" class="activity-dialog"><section class="activity-dialog-body"><header class="activity-dialog-head"><h2 data-person-name>签到详情</h2><button type="button" data-close-activity-dialog="checkin-detail-dialog" aria-label="关闭">×</button></header><div class="activity-detail-lines"><div><span>签到状态</span><strong data-person-status>—</strong></div><div><span>签到信息</span><strong data-person-meta>—</strong></div><div><span>审核记录</span><strong data-person-extra>—</strong></div></div><div class="button-row"><button class="button secondary" type="button" style="flex:1" data-open-activity-dialog="makeup-dialog">补签</button><button class="button tertiary" type="button" style="flex:1" data-open-activity-dialog="revoke-dialog">取消签到</button></div></section></dialog>
  <dialog id="makeup-dialog" class="activity-dialog"><form class="activity-dialog-body" data-activity-form data-activity-message="补签已提交，签到记录将标注为管理员补签"><header class="activity-dialog-head"><h2>补签</h2><button type="button" data-close-activity-dialog="makeup-dialog" aria-label="关闭">×</button></header><div class="activity-field"><label for="makeup-reason">补签理由</label><textarea id="makeup-reason" required placeholder="例如：因网络异常未能完成位置签到"></textarea></div><button class="button full" type="submit">确认补签</button></form></dialog>
  <dialog id="revoke-dialog" class="activity-dialog"><form class="activity-dialog-body" data-activity-form data-activity-message="签到已撤销，原因与凭证状态已同步至审计"><header class="activity-dialog-head"><h2>取消签到</h2><button type="button" data-close-activity-dialog="revoke-dialog" aria-label="关闭">×</button></header><div class="activity-field"><label for="revoke-reason">撤销原因</label><textarea id="revoke-reason" required placeholder="请说明撤销原因，例如签到凭证不符合活动要求"></textarea></div><button class="button full activity-danger" type="submit">确认撤销</button></form></dialog>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div><script src="campus-native.js"></script><script src="campus-activity-admin.js"></script>
</body>
</html>
