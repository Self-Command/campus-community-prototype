<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 发布二手</title>
  <link rel="stylesheet" href="campus-native.css">
  <link rel="stylesheet" href="campus-services.css">
</head>
<body>
  <div class="service-app" data-service-theme="market">
    <main>
      <header class="appbar"><div class="appbar-left"><button class="icon-button" data-nav="campus-secondhand.html" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div><div class="appbar-center"><strong>发布二手</strong></div><div class="appbar-right"><button class="text-link" type="submit" form="secondhand-form">提交</button></div></header>
      <form id="secondhand-form" class="service-compose" data-submit-message="商品已提交审核" data-success-nav="campus-secondhand-my.html" data-state-root>
        <p class="compose-note"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 3 20h18L12 3Z"/><path d="M12 9v4m0 4h.01"/></svg>商品公开前会进入审核。请如实描述成色、配件与交易方式；平台不提供线上支付。</p>
        <section class="compose-group"><div class="compose-group-label">商品图片</div><div class="compose-field"><div class="media-picker" data-media-picker><button type="button" data-open-media-picker aria-label="添加商品图片"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><span class="media-slot" data-media-slot hidden></span><span class="media-slot" data-media-slot hidden></span><span class="media-slot" data-media-slot hidden></span><input type="file" accept="image/*" multiple></div><small>最多 9 张，首张作为商品封面。</small></div></section>
        <section class="compose-group"><div class="compose-group-label">商品信息</div><div class="compose-field"><label for="title">商品标题</label><input id="title" required maxlength="50" placeholder="例如：iPad mini 6 · 64G 深空灰"></div><div class="compose-field inline"><label for="category">商品分类</label><span class="field-control"><select id="category" required><option>数码</option><option>书籍教材</option><option>生活用品</option><option>衣物鞋包</option><option>运动器材</option><option>其他</option></select></span></div><div class="compose-pair"><div class="compose-field"><label for="price">定价（元）</label><input id="price" type="number" min="1" required placeholder="必填"></div><div class="compose-field"><label for="original-price">原价（元）</label><input id="original-price" type="number" min="1" placeholder="可选"></div></div><div class="compose-field inline"><label for="condition">成色</label><span class="field-control"><select id="condition" required><option>全新</option><option>几乎全新</option><option>八九成新</option><option>七成新以下</option></select></span></div><div class="compose-field inline"><label for="purchase-date">购买时间</label><span class="field-control"><input id="purchase-date" type="month"></span></div><div class="compose-field"><label for="description">商品描述</label><textarea id="description" required maxlength="500" placeholder="说明使用情况、配件、瑕疵，以及是否支持议价。"></textarea></div></section>
        <section class="compose-group"><div class="compose-group-label">交易与联系</div><div class="compose-field"><label>交易方式</label><div class="compose-choice" data-choice-group data-choice-input="#trade-method"><button class="active" type="button" data-value="校内面交">校内面交</button><button type="button" data-value="快递">快递</button><button type="button" data-value="都可以">都可以</button></div><input id="trade-method" type="hidden" value="校内面交"></div><div class="compose-field"><label for="place">交易地点</label><input id="place" required placeholder="例如：大学生活动中心一楼"></div><div class="compose-field inline"><label for="bargain">支持议价</label><span class="field-control"><select id="bargain"><option>支持议价</option><option>价格固定</option></select></span></div><div class="compose-field"><label for="contact">联系方式</label><input id="contact" required placeholder="手机号或 QQ；公开时按规则脱敏"></div></section>
        <div class="compose-submitbar"><button class="button secondary" type="button" data-action-toast="草稿已保存">存草稿</button><button class="button" type="submit">提交审核</button></div>
      </form>
    </main>
  </div>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
  <script src="campus-services.js"></script>
</body>
</html>
