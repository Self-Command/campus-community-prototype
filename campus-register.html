<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 注册</title>
  <link rel="stylesheet" href="campus-native.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-stage">
      <article class="auth-card" data-stepper-root data-current-step="type">
        <div class="stepper">
          <span class="step-chip active" data-step-index>1</span><i class="active"></i>
          <span class="step-chip" data-step-index>2</span><i></i>
          <span class="step-chip" data-step-index>3</span>
        </div>

        <section data-step-panel="type">
          <span class="eyebrow">步骤 1 / 3</span>
          <h1 class="auth-title">选择身份类型</h1>
          <p class="auth-subtitle">注册阶段强制采集真实姓名与学号/工号，但默认不做人工核验；若后台开启校验，则创建后进入待审核状态。</p>
          <div class="choice-grid columns-3">
            <button class="choice-card active" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 20a8 8 0 1 0-8-8"/><path d="M4 12h8v8"/></svg><strong>学生</strong><span>学号必填，默认展示用户名</span></button>
            <button class="choice-card" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h16v12H4zM8 8V5h8v3"/></svg><strong>教职工</strong><span>工号必填，前台默认展示真实姓名</span></button>
            <button class="choice-card" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M6 20V8h12v12M9 8V5h6v3"/></svg><strong>工作人员</strong><span>工作号必填，可配置私信范围</span></button>
          </div>
          <div class="button-row space-top-lg">
            <a class="button tertiary" href="campus-login.html" style="flex:1">返回登录</a>
            <button class="button" type="button" style="flex:1" data-step-next="form">下一步</button>
          </div>
        </section>

        <section data-step-panel="form" hidden>
          <span class="eyebrow">步骤 2 / 3</span>
          <h2 class="auth-title">填写基础信息</h2>
          <div class="inline-grid">
            <div class="split-fields">
              <div class="field"><label>真实姓名</label><input required placeholder="请输入真实姓名"></div>
              <div class="field"><label>手机号</label><input required inputmode="tel" pattern="1\d{10}" placeholder="请输入 11 位手机号"></div>
            </div>
            <div class="split-fields">
              <div class="field"><label>学号 / 工号</label><input required placeholder="系统将加密存储"></div>
              <div class="field"><label>学院 / 部门</label><input required placeholder="例如：计算机学院"></div>
            </div>
            <div class="split-fields">
              <div class="field"><label>密码</label><input id="register-password" type="password" required minlength="8" maxlength="128" placeholder="8-128 位密码"></div>
              <div class="field"><label>确认密码</label><input type="password" required minlength="8" maxlength="128" data-match="#register-password" data-match-message="两次输入的密码不一致" placeholder="再次输入密码"></div>
            </div>
            <div class="info-strip"><svg class="i banner-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4m0 4h.01"/></svg>首次自定义用户名不占修改次数、不进入审核；后续修改间隔与旧用户名冷却期均为 30 天。</div>
            <label class="state-strip"><input type="checkbox" required style="margin-top:2px">我已阅读并同意校园社区服务协议与隐私说明</label>
          </div>
          <div class="button-row space-top-lg">
            <button class="button tertiary" type="button" style="flex:1" data-step-prev="type">上一步</button>
            <button class="button" type="button" style="flex:1" data-step-next="verify">下一步</button>
          </div>
        </section>

        <section data-step-panel="verify" hidden>
          <span class="eyebrow">步骤 3 / 3</span>
          <h2 class="auth-title">验证手机号</h2>
          <p class="auth-subtitle">验证码 60 秒内不可重复发送。提交成功后跳转资料完善引导页。</p>
          <form class="inline-grid" data-submit-message="注册成功，正在进入资料完善" data-success-nav="campus-onboarding.html">
            <div class="split-fields">
              <div class="field"><label>验证码</label><input required inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="请输入 6 位验证码"></div>
              <div class="field"><label>发送验证码</label><button class="code-button" type="button" data-countdown-seconds="60" data-countdown-label="重新发送">发送验证码</button></div>
            </div>
            <div class="success-strip"><svg class="i banner-icon" viewBox="0 0 24 24"><path d="m7 12 3 3 7-7"/><circle cx="12" cy="12" r="9"/></svg>注册最小字段已经覆盖学生、教职工、工作人员三类身份，满足文档中的实名、唯一性和协议勾选要求。</div>
            <div class="button-row">
              <button class="button tertiary" type="button" style="flex:1" data-step-prev="form">上一步</button>
              <button class="button" type="submit" style="flex:1">完成注册</button>
            </div>
          </form>
        </section>
      </article>
    </section>
  </main>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
</body>
</html>
