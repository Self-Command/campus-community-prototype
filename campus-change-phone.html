<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 修改手机号</title>
  <link rel="stylesheet" href="campus-native.css">
</head>
<body>
  <div class="app-shell" data-tab-scope>
    <main>
      <header class="appbar">
        <div class="appbar-left"><button class="icon-button" data-nav="campus-account-settings.html" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div>
        <div class="appbar-center"><strong>修改手机号</strong></div>
        <div class="appbar-right"><button class="button" style="min-height:34px;padding:0 12px" form="phone-form" type="submit">确认</button></div>
      </header>
      <section class="page">
        <form id="phone-form" class="detail-stack" data-submit-message="手机号已更新" data-success-nav="campus-account-settings.html">
          <div class="detail-card">
            <h3>当前绑定</h3>
            <p class="muted-copy">当前手机号：138****5678。修改后将作为新的唯一登录账号。</p>
            <div class="split-fields"><div class="field"><label>旧手机号验证码</label><input required inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="输入短信验证码"></div><div class="field"><label>发送验证码</label><button class="code-button" type="button" data-countdown-seconds="60" data-countdown-label="重新发送">发送到旧手机号</button></div></div>
          </div>
          <div class="detail-card">
            <h3>新手机号</h3>
            <div class="split-fields"><div class="field"><label>新手机号</label><input required inputmode="tel" pattern="^1[3-9]\d{9}$" placeholder="请输入新手机号"></div><div class="field"><label>新手机号验证码</label><div class="split-fields" style="grid-template-columns:1fr auto"><input required inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="6 位验证码"><button class="code-button" type="button" data-countdown-seconds="60" data-countdown-label="重新发送">发送验证码</button></div></div></div>
            <div class="warning-strip"><svg class="i banner-icon" viewBox="0 0 24 24"><path d="M12 3 3 20h18L12 3Z"/><path d="M12 9v4m0 4h.01"/></svg>连续修改或异常频率会触发风控校验；修改成功后旧手机号立即失效。</div>
          </div>
        </form>
      </section>
    </main>
  </div>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
</body>
</html>
