<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 我的投票</title>
  <link rel="stylesheet" href="campus-native.css">
  <link rel="stylesheet" href="campus-personal.css">
</head>
<body>
  <div class="app-shell" data-tab-scope>
    <main>
      <header class="appbar">
        <div class="appbar-left"><button class="icon-button" data-nav="campus-profile.html" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div>
        <div class="appbar-center"><strong>我的投票</strong></div>
        <div class="appbar-right"></div>
      </header>
      <section class="personal-page">
        <div class="personal-filter" data-tab-group aria-label="投票分类"><button class="active" data-tab="joined">我参与的</button><button data-tab="created">我发起的</button></div>
        <section data-tab-panel="joined">
          <div class="personal-list">
            <a class="personal-row" href="campus-vote-result.html"><span class="personal-thumb vote-one">投</span><span class="personal-copy"><h2>图书馆期末周是否延长开放至 23:00？</h2><p>已投票 128 人 · 6 月 30 日截止</p><span class="personal-meta"><span class="status">已投票</span><span>我的选择：支持延长</span></span></span><span class="personal-tail">查看结果<br><svg class="i chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span></a>
            <a class="personal-row" href="campus-vote-detail.html"><span class="personal-thumb vote-two">讲</span><span class="personal-copy"><h2>学院讲座主题偏好调查</h2><p>明天 18:00 截止 · 结果投票后可见</p><span class="personal-meta"><span class="status">未投票</span><span>选择后不可修改</span></span></span><span class="personal-tail">去投票<br><svg class="i chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span></a>
            <a class="personal-row" href="campus-vote-result.html"><span class="personal-thumb vote-two">社</span><span class="personal-copy"><h2>最佳社团评选</h2><p>已截止 · 匿名投票</p><span class="personal-meta"><span class="status">结果已归档</span><span>仅展示统计，不展示投票人</span></span></span><span class="personal-tail">查看结果<br><svg class="i chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span></a>
          </div>
        </section>
        <section data-tab-panel="created" hidden>
          <p class="personal-section-note">发起者可查看统计，手动截止与导出操作在投票结果页进行。</p>
          <div class="personal-list">
            <a class="personal-row" href="campus-vote-result.html"><span class="personal-thumb vote-two">摄</span><span class="personal-copy"><h2>摄影社外拍日期征集</h2><p>进行中 · 多选 · 结果截止后公开</p><span class="personal-meta"><span class="status">已投 56 人</span><span>还剩 2 天</span></span></span><span class="personal-tail">查看统计<br><svg class="i chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span></a>
          </div>
        </section>
      </section>
    </main>
  </div>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
</body>
</html>
