<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 修改密码</title>
  <link rel="stylesheet" href="campus-native.css">
</head>
<body>
  <div class="app-shell" data-tab-scope>
    <main>
      <header class="appbar">
        <div class="appbar-left"><button class="icon-button" data-nav="campus-account-settings.html" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div>
        <div class="appbar-center"><strong>修改密码</strong></div>
        <div class="appbar-right"><button class="button" style="min-height:34px;padding:0 12px" form="password-form" type="submit">确认</button></div>
      </header>
      <section class="page">
        <form id="password-form" class="detail-stack" data-submit-message="密码已修改" data-success-nav="campus-account-settings.html">
          <div class="detail-card">
            <h3>安全规则</h3>
            <div class="checklist">
              <div class="check-item"><span class="check-badge done">1</span><div class="check-body"><strong>至少 8 位</strong><span>必须包含大写字母、小写字母和数字。</span></div></div>
              <div class="check-item"><span class="check-badge done">2</span><div class="check-body"><strong>不得与用户名、真实姓名相同</strong><span>弱密码会被直接拦截。</span></div></div>
              <div class="check-item"><span class="check-badge done">3</span><div class="check-body"><strong>支持退出其他设备</strong><span>修改成功后可立即失效其他登录会话。</span></div></div>
            </div>
          </div>
          <div class="detail-card">
            <div class="field input-wrap"><label>当前密码</label><input id="current-password" required type="password" placeholder="请输入当前密码"><button class="trailing-button" type="button" data-toggle-password="#current-password">显示</button></div>
            <div class="field input-wrap"><label>新密码</label><input id="new-password" required type="password" minlength="8" maxlength="128" placeholder="请输入新密码"><button class="trailing-button" type="button" data-toggle-password="#new-password">显示</button></div>
            <div class="field"><label>确认新密码</label><input required type="password" data-match="#new-password" data-match-message="两次输入的新密码不一致" placeholder="再次输入新密码"></div>
            <label class="state-strip"><input type="checkbox" checked style="margin-top:2px">修改后退出其他设备，仅保留当前设备登录</label>
          </div>
        </form>
      </section>
    </main>
  </div>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
</body>
</html>
