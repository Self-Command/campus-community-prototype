<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>校园社区 · 活动设置</title><link rel="stylesheet" href="campus-native.css"><link rel="stylesheet" href="campus-activity-admin.css"></head>
<body>
  <div class="app-shell"><main>
    <header class="appbar"><div class="appbar-left"><button class="icon-button" data-nav="campus-activity-manage.html" aria-label="返回活动管理"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div><div class="appbar-center"><strong>活动设置</strong></div><div class="appbar-right"></div></header>
    <section class="page activity-page" data-state-root>
      <header class="activity-context"><p class="activity-kicker">摄影社夜拍工作坊</p><h1>活动设置</h1><p>活动创建者或具备权限的频道管理员可修改活动信息与状态；影响报名者的操作会发送通知。</p></header>
      <section class="activity-section"><div class="activity-section-head"><h2>活动信息</h2></div><nav class="activity-action-list"><a class="activity-action-row" href="campus-publish-activity.html?mode=edit"><span class="activity-row-icon"><svg class="i" viewBox="0 0 24 24"><path d="M5 19h14M7 16l9-9 2 2-9 9-3 1z"/></svg></span><span class="activity-action-copy"><strong>编辑活动信息</strong><small>名称、时间、地点、封面与报名字段</small></span><svg class="i activity-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a></nav></section>
      <section class="activity-section"><div class="activity-section-head"><h2>报名与签到</h2></div><form class="activity-form-list" data-activity-form data-activity-message="报名规则已保存，后续报名将按新规则校验"><div class="activity-field"><label for="signup-rule">报名方式</label><select id="signup-rule"><option>直接报名，满员进入候补</option><option>需管理员审核</option><option>仅指定频道成员可报名</option></select></div><div class="activity-rule-line"><span><strong>允许候补自动递补</strong><small>有人取消后按候补顺序自动确认</small></span><button class="switch on" type="button" data-switch="activity-waitlist"><i></i></button></div><button class="button secondary full" type="submit">保存报名规则</button></form></section>
      <section class="activity-section"><div class="activity-section-head"><h2>状态操作</h2></div><nav class="activity-action-list"><button class="activity-action-row" type="button" data-open-activity-dialog="postpone-dialog"><span class="activity-row-icon amber"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg></span><span class="activity-action-copy"><strong>延期活动</strong><small>更新活动时间并允许报名者按规则取消</small></span><svg class="i activity-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button><button class="activity-action-row" type="button" data-open-activity-dialog="cancel-dialog"><span class="activity-row-icon red"><svg class="i" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/><circle cx="12" cy="12" r="9"/></svg></span><span class="activity-action-copy"><strong class="activity-danger">取消活动</strong><small>通知已报名和候补用户，保留记录供查询</small></span><svg class="i activity-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button><button class="activity-action-row" type="button" data-open-activity-dialog="delete-dialog"><span class="activity-row-icon red"><svg class="i" viewBox="0 0 24 24"><path d="M6 7h12m-8 4v5m4-5v5M9 7l1-2h4l1 2m-7 0 1 13h6l1-13"/></svg></span><span class="activity-action-copy"><strong class="activity-danger">删除活动</strong><small>仅未开始且无有效报名记录时可执行</small></span><svg class="i activity-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></nav></section>
    </section>
  </main></div>
  <dialog id="postpone-dialog" class="activity-dialog"><form class="activity-dialog-body" data-activity-form data-activity-message="活动延期已提交，报名者将收到新的时间安排"><header class="activity-dialog-head"><h2>延期活动</h2><button type="button" data-close-activity-dialog="postpone-dialog" aria-label="关闭">×</button></header><div class="activity-field"><label for="new-date">新的开始时间</label><input id="new-date" type="datetime-local" required></div><div class="activity-field"><label for="postpone-reason">延期说明</label><textarea id="postpone-reason" required placeholder="请说明延期原因，系统将发送给已报名与候补人员"></textarea></div><button class="button full" type="submit">确认延期</button></form></dialog>
  <dialog id="cancel-dialog" class="activity-dialog"><form class="activity-dialog-body" data-activity-form data-activity-message="活动已取消，已报名与候补人员将收到通知"><header class="activity-dialog-head"><h2>取消活动</h2><button type="button" data-close-activity-dialog="cancel-dialog" aria-label="关闭">×</button></header><div class="activity-field"><label for="cancel-reason">取消原因</label><textarea id="cancel-reason" required placeholder="请填写取消原因"></textarea></div><button class="button full activity-danger" type="submit">确认取消活动</button></form></dialog>
  <dialog id="delete-dialog" class="activity-dialog"><form class="activity-dialog-body" data-activity-form data-activity-message="删除请求已校验；若存在有效报名记录，系统将拒绝执行"><header class="activity-dialog-head"><h2>删除活动</h2><button type="button" data-close-activity-dialog="delete-dialog" aria-label="关闭">×</button></header><div class="activity-field"><label for="delete-confirm">输入活动名称确认</label><input id="delete-confirm" required placeholder="摄影社夜拍工作坊"></div><button class="button full activity-danger" type="submit">提交删除校验</button></form></dialog>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div><script src="campus-native.js"></script><script src="campus-activity-admin.js"></script>
</body>
</html>
