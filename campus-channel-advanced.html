<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 高级操作与审计</title>
  <link rel="stylesheet" href="campus-native.css">
  <link rel="stylesheet" href="campus-channel.css">
</head>
<body>
  <div class="app-shell">
    <main>
      <header class="appbar">
        <div class="appbar-left">
          <button class="icon-button" data-channel-link="campus-channel-manage.html" aria-label="返回">
            <svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          </button>
        </div>
        <div class="appbar-center"><strong>高级操作与审计</strong></div>
        <div class="appbar-right"><span class="channel-tag" data-role-label>频道创建者</span></div>
      </header>

      <section class="page channel-page">
        <section class="channel-sheet">
          <div class="channel-block">
            <span class="channel-kicker">ADVANCED</span>
            <h1 class="channel-headline"><span data-channel-name>校学生会</span>高级操作</h1>
            <p class="channel-copy">只有创建者和平台总管理员能看到这页。高危操作单独放页，不和普通设置混在一起。</p>
          </div>
        </section>

        <section class="channel-sheet">
          <div class="channel-section-head">
            <div>
              <h2>高危操作</h2>
              <p>转让创建者、申请解散都需要二次确认和审计。</p>
            </div>
          </div>
          <div class="channel-row-list">
            <a class="channel-row no-icon" href="#">
              <div class="channel-row-main">
                <div class="channel-row-title">转让创建者</div>
                <div class="channel-row-sub">将创建者身份转移给现有管理员，原创建者降为普通管理员。</div>
              </div>
              <div class="channel-row-tail"><svg class="i chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></div>
            </a>
            <a class="channel-row no-icon" href="#">
              <div class="channel-row-main">
                <div class="channel-row-title">申请解散频道</div>
                <div class="channel-row-sub">提交平台审核，通过后频道前台停止更新，历史内容只读保留。</div>
              </div>
              <div class="channel-row-tail"><svg class="i chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></div>
            </a>
          </div>
        </section>

        <section class="channel-sheet">
          <div class="channel-section-head">
            <div>
              <h2>最近审计</h2>
              <p>只看最近关键变更，避免把整个页面做成大看板。</p>
            </div>
          </div>
          <div class="channel-row-list" data-audit-row-list></div>
        </section>
      </section>
    </main>
  </div>
  <script src="campus-native.js"></script>
  <script src="campus-channel-admin-data.js"></script>
  <script>
    (() => {
      const api = window.CampusChannelAdminData;
      const ctx = api?.getContext();
      if (!api || !ctx) return;
      api.applyContext(document, ctx);
      document.querySelector('[data-audit-row-list]').innerHTML = api.auditRows.map((row) => `
        <div class="channel-row no-icon">
          <div class="channel-row-main">
            <div class="channel-row-title">${row.title}</div>
            <div class="channel-row-sub">${row.detail}</div>
          </div>
        </div>`).join('');
    })();
  </script>
</body>
</html>
