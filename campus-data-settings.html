<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>校园社区 · 数据与存储</title><link rel="stylesheet" href="campus-native.css"><link rel="stylesheet" href="campus-personal.css"></head>
<body><div class="app-shell"><main>
  <header class="appbar"><div class="appbar-left"><button class="icon-button" data-nav="campus-account-settings.html" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div><div class="appbar-center"><strong>数据与存储</strong></div><div class="appbar-right"></div></header>
  <section class="settings-page-clean">
    <section class="settings-group"><div class="settings-group-title">本地存储</div><button class="settings-row" type="button" data-clear-cache><span><strong>清理缓存</strong><small>图片、视频封面和临时文件</small></span><span class="pill" data-cache-size>128 MB</span></button></section>
    <section class="settings-group"><div class="settings-group-title">个人数据</div><button class="settings-row" type="button" data-export-data><span><strong>导出个人数据</strong><small>帖子、评论、私信和账号审计记录</small></span><svg class="i chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></section>
  </section>
</main></div><div class="toast" data-toast-region role="status" aria-live="polite"></div><script src="campus-native.js"></script><script>(()=>{document.querySelector('[data-clear-cache]')?.addEventListener('click',()=>{const size=document.querySelector('[data-cache-size]');if(size)size.textContent='0 MB';});document.querySelector('[data-export-data]')?.addEventListener('click',(event)=>{event.currentTarget.querySelector('small').textContent='导出申请已创建，完成后会通过通知中心提醒你。';});})();</script></body>
</html>
