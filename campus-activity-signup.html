<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 活动报名</title>
  <link rel="stylesheet" href="campus-native.css">
</head>
<body>
  <div class="app-shell" data-tab-scope>
    <main>
      <header class="appbar">
        <div class="appbar-left"><button class="icon-button" data-nav="campus-activity-detail.html" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div>
        <div class="appbar-center"><strong>活动报名</strong></div>
        <div class="appbar-right"><button class="button" style="min-height:34px;padding:0 12px" form="activity-signup-form" type="submit">提交</button></div>
      </header>
      <section class="page">
        <form id="activity-signup-form" class="detail-stack" data-submit-message="报名成功，已进入活动名单" data-success-nav="campus-my-activities.html">
          <div class="detail-card">
            <h3>自动带入信息</h3>
            <div class="split-fields"><div class="field"><label>真实姓名</label><input value="林墨" readonly></div><div class="field"><label>学号</label><input value="2023102048" readonly></div></div>
            <div class="split-fields"><div class="field"><label>班级</label><input value="软件工程 2023 级 2 班" readonly></div><div class="field"><label>手机号</label><input required inputmode="tel" pattern="^1[3-9]\d{9}$" placeholder="报名联系人手机号"></div></div>
          </div>
          <div class="detail-card">
            <h3>自定义报名字段</h3>
            <div class="field"><label>准备交换的物品类型</label><input placeholder="例如：教材、数码配件、桌面用品"></div>
            <div class="field"><label>是否愿意参加现场志愿整理</label><select><option>愿意</option><option>不参与</option></select></div>
            <div class="field"><label>补充说明</label><textarea maxlength="160" placeholder="可填写到场时间或特殊需求"></textarea></div>
          </div>
          <div class="warning-strip"><svg class="i banner-icon" viewBox="0 0 24 24"><path d="M12 3 3 20h18L12 3Z"/><path d="M12 9v4m0 4h.01"/></svg>你的手机号会提供给活动组织者用于联系；普通用户只看见“已报名 X 人 / 候补 Y 人”，完整名单仅活动管理员可见。</div>
        </form>
      </section>
    </main>
  </div>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
</body>
</html>
