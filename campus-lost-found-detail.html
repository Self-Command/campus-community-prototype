<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 失物详情</title>
  <link rel="stylesheet" href="campus-native.css">
  <link rel="stylesheet" href="campus-services.css">
</head>
<body>
  <div class="service-app" data-service-theme="lost">
    <main class="service-detail" data-state-root>
      <header class="appbar"><div class="appbar-left"><button class="icon-button" data-nav="campus-lost-found.html" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div><div class="appbar-center"><strong>失物详情</strong></div><div class="appbar-right"><button class="icon-button" aria-label="更多"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div></header>
      <div class="service-hero-gallery" aria-label="物品图片，可左右滑动查看"><div></div><div></div><span class="gallery-count">1 / 2</span></div>
      <section class="detail-body">
        <div class="detail-kicker"><span class="svc-status warning">寻找中</span><span>寻物启事 · 60 天后自动下线</span></div>
        <h1 class="detail-title">蓝色保温杯</h1>
        <div class="detail-info-line"><span><svg class="i" viewBox="0 0 24 24"><path d="M12 21s7-4.6 7-11a7 7 0 1 0-14 0c0 6.4 7 11 7 11Z"/></svg>图书馆三楼自习区</span><span>2026-06-20 18:20</span></div>
        <div class="detail-rule"></div>
        <section class="detail-section"><h2>物品描述</h2><p>杯身深蓝色，带一张白色贴纸；杯盖边缘有轻微划痕，里面可能留有一根银色吸管。如有拾到，请先提供线索确认物品特征。</p></section>
        <section class="detail-section"><h2>发布者</h2><a class="seller-line" href="campus-user-home.html?userId=lin-mo"><span class="seller-avatar">林</span><span><strong>林墨</strong><small>计算机学院 · 已实名认证</small></span><svg class="i" style="margin-left:auto;color:var(--svc-muted)" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a><p class="contact-inline">联系方式：<span id="lost-contact" data-full="138 5792 6418">138****6418</span></p><p class="detail-notice" style="margin-top:12px"><svg class="i" viewBox="0 0 24 24"><path d="M12 3 3 20h18L12 3Z"/><path d="M12 9v4m0 4h.01"/></svg>请不要在公开回复里留下身份证号、手机号或完整物品特征。联系方式按规则脱敏展示。</p></section>
      </section>
      <div class="detail-actionbar"><button class="icon-button" type="button" data-save aria-label="收藏"><svg class="i" viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z"/></svg></button><button class="button secondary" type="button" data-interest>提供线索</button><button class="button" type="button" data-reveal-contact="#lost-contact">查看联系方式</button></div>
    </main>
  </div>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
  <script src="campus-services.js"></script>
</body>
</html>
