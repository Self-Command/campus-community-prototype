<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 私信聊天</title>
  <link rel="stylesheet" href="campus-native.css">
</head>
<body>
  <div class="app-shell" data-tab-scope>
    <main class="dm-shell">
      <header class="appbar dm-appbar">
        <div class="appbar-left"><button class="icon-button" data-nav="campus-messages.html" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div>
        <div class="appbar-center">
          <a class="dm-title-person" href="campus-user-home.html?userId=club_member" aria-label="查看顾宁的个人主页">
            <span class="avatar green">顾</span>
            <span><strong>顾宁</strong><small>摄影社成员 · 在线</small></span>
          </a>
        </div>
        <div class="appbar-right"><button class="icon-button" data-nav="campus-chat-profile.html?conversationId=conv_gu_ning&userId=club_member" aria-label="会话资料"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div>
      </header>

      <section class="dm-page" aria-label="私信会话">
        <div class="permission-strip dm-permission"><svg class="i banner-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4m0 4h.01"/></svg>你和对方具备互相私信权限。文本即时投递；图片、语音和首次私信会进入内容安全策略。</div>

        <div class="dm-thread" data-dm-thread>
          <a class="dm-profile-hero" href="campus-user-home.html?userId=club_member">
            <span class="avatar green">顾</span>
            <strong>顾宁</strong>
            <small>@club-member · 摄影社成员 · 校园影像频道</small>
            <em>查看个人主页</em>
          </a>

          <div class="dm-date">今天 10:40</div>

          <article class="dm-message incoming">
            <a class="avatar green" href="campus-user-home.html?userId=club_member" aria-label="查看顾宁主页">顾</a>
            <div class="dm-bubble-group">
              <div class="dm-bubble">活动海报我已经发到频道里了，你看一下。报名说明可能需要再补一段“候补规则”。</div>
              <div class="dm-meta">10:42</div>
            </div>
          </article>

          <article class="dm-message outgoing">
            <div class="dm-bubble-group">
              <div class="dm-bubble">收到，我一会补上活动报名说明。</div>
              <div class="dm-meta">已读 · 10:44</div>
            </div>
          </article>

          <article class="dm-message incoming">
            <a class="avatar green" href="campus-user-home.html?userId=club_member" aria-label="查看顾宁主页">顾</a>
            <div class="dm-bubble-group">
              <button class="dm-image-bubble" type="button" data-action-toast="图片预览已打开" aria-label="查看海报图片"><span></span><b>活动海报预览</b><small>1200×400 · 频道封面比例</small></button>
              <div class="dm-meta">10:46</div>
            </div>
          </article>

          <article class="dm-message outgoing">
            <div class="dm-bubble-group">
              <div class="dm-bubble audit">这张图我先发你确认，图片审核通过前仅自己可见。</div>
              <div class="dm-meta">审核中 · 10:47</div>
            </div>
          </article>

          <article class="dm-message outgoing">
            <div class="dm-bubble-group">
              <div class="dm-bubble failed">我把活动时间写成周五晚 7 点，可以吗？</div>
              <div class="dm-meta"><button type="button" data-action-toast="正在重新发送">发送失败，点此重试</button></div>
            </div>
          </article>

          <article class="dm-message incoming">
            <a class="avatar green" href="campus-user-home.html?userId=club_member" aria-label="查看顾宁主页">顾</a>
            <div class="dm-bubble-group">
              <div class="dm-voice-bubble"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M8 8v8M16 9v6M5 11v2M19 11v2"/></svg><span>0:12</span></div>
              <div class="dm-meta">10:51</div>
            </div>
          </article>
        </div>

        <form class="dm-composer" data-dm-form aria-label="发送私信">
          <div class="dm-tool-panel" data-dm-tools-panel hidden>
            <button type="button" data-dm-tool="camera"><svg class="i" viewBox="0 0 24 24"><path d="M6 7h3l1-2h4l1 2h3v12H6z"/><circle cx="12" cy="13" r="3"/></svg><span>拍摄</span></button>
            <button type="button" data-dm-tool="album"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m5 17 5-5 3 3 2-2 4 4"/></svg><span>相册</span></button>
            <button type="button" data-dm-tool="file"><svg class="i" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5"/></svg><span>文件</span></button>
            <button type="button" data-dm-tool="location"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s7-5 7-11a7 7 0 0 0-14 0c0 6 7 11 7 11Z"/><circle cx="12" cy="10" r="2"/></svg><span>位置</span></button>
          </div>
          <div class="dm-emoji-panel" data-dm-emoji-panel hidden>
            <button type="button">👍</button><button type="button">😂</button><button type="button">🙏</button><button type="button">🎉</button><button type="button">👌</button><button type="button">📌</button>
          </div>
          <div class="dm-input-row">
            <button class="dm-round-action" type="button" data-dm-toggle-tools aria-label="展开更多功能"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
            <button class="dm-round-action" type="button" data-dm-audio aria-label="语音"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="4" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
            <div class="dm-text-pill">
              <textarea required maxlength="1000" rows="1" data-dm-input placeholder="发消息"></textarea>
              <button type="button" data-dm-mention aria-label="艾特对方">@</button>
              <button type="button" data-dm-emoji aria-label="表情"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 15a5 5 0 0 0 7 0M9 10h.01M15 10h.01"/></svg></button>
            </div>
            <button class="dm-send" type="submit" aria-label="发送"><svg class="i" viewBox="0 0 24 24"><path d="M4 12 20 5l-4 14-4-6-8-1Z"/></svg></button>
          </div>
        </form>
      </section>
    </main>
  </div>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
  <script>
    (() => {
      const form = document.querySelector('[data-dm-form]');
      const input = document.querySelector('[data-dm-input]');
      const thread = document.querySelector('[data-dm-thread]');
      const tools = document.querySelector('[data-dm-tools-panel]');
      const emojiPanel = document.querySelector('[data-dm-emoji-panel]');
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      const notify = (message) => {
        const toast = document.querySelector('[data-toast-region]');
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(notify.timer);
        notify.timer = setTimeout(() => toast.classList.remove('show'), 1800);
      };
      document.querySelector('[data-dm-toggle-tools]')?.addEventListener('click', () => {
        tools.hidden = !tools.hidden;
        if (!tools.hidden) emojiPanel.hidden = true;
      });
      document.querySelector('[data-dm-emoji]')?.addEventListener('click', () => {
        emojiPanel.hidden = !emojiPanel.hidden;
        if (!emojiPanel.hidden) tools.hidden = true;
      });
      document.querySelector('[data-dm-mention]')?.addEventListener('click', () => {
        input.value = `${input.value}${input.value ? ' ' : ''}@顾宁 `;
        input.focus();
      });
      document.querySelector('[data-dm-audio]')?.addEventListener('click', (event) => {
        event.currentTarget.classList.toggle('recording');
        notify(event.currentTarget.classList.contains('recording') ? '正在录音，松开发送' : '语音已取消');
      });
      document.querySelectorAll('[data-dm-tool]').forEach((button) => button.addEventListener('click', () => {
        const labels = { camera: '相机已打开', album: '图片选择器已打开', file: '文件选择器已打开', location: '位置选择器已打开' };
        notify(labels[button.dataset.dmTool] || '功能已打开');
      }));
      document.querySelectorAll('[data-dm-emoji-panel] button').forEach((button) => button.addEventListener('click', () => {
        input.value += button.textContent;
        input.focus();
      }));
      form?.addEventListener('submit', (event) => {
        event.preventDefault();
        const value = input.value.trim();
        if (!value) { notify('请输入消息内容'); return; }
        const item = document.createElement('article');
        item.className = 'dm-message outgoing';
        item.innerHTML = `<div class="dm-bubble-group"><div class="dm-bubble">${escapeHtml(value)}</div><div class="dm-meta">发送中</div></div>`;
        thread.append(item);
        input.value = '';
        tools.hidden = true;
        emojiPanel.hidden = true;
        thread.scrollTop = thread.scrollHeight;
        setTimeout(() => {
          const meta = item.querySelector('.dm-meta');
          if (meta) meta.textContent = '已送达 · 等待对方查看';
        }, 700);
      });
    })();
  </script>
</body>
</html>
