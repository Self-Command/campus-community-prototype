        <header class="news-lead"><span class="svc-status">校园公告</span><h1>图书馆期末周服务时间调整</h1><div class="news-source"><span>学生处</span><span>·</span><time datetime="2026-06-21T09:00">今天 09:00</time><span>·</span><span>阅读 1,286</span></div></header>
        <div class="news-cover" aria-label="图书馆期末周服务时间调整封面"></div>
        <section class="news-copy"><p>为满足期末复习期间的学习需求，图书馆主馆自 6 月 23 日起调整开放时间为 07:30—22:30。各分馆及自习室预约规则保持不变。</p><h2>服务安排</h2><p>主馆夜间延长开放区域为一层、二层东侧和三层自习区。闭馆前 30 分钟停止入馆，请同学们合理安排学习时间。</p><p>如遇设备故障或座位使用问题，可通过图书馆服务台或校园社区反馈入口提交。馆内请保持安静，共同维护复习环境。</p></section>
