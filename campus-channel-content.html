<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 内容管理</title>
  <link rel="stylesheet" href="campus-native.css">
  <link rel="stylesheet" href="campus-channel.css">
</head>
<body>
  <div class="app-shell">
    <main>
      <header class="appbar">
        <div class="appbar-left">
          <button class="icon-button" data-channel-link="campus-channel-manage.html" aria-label="返回">
            <svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          </button>
        </div>
        <div class="appbar-center"><strong>内容管理</strong></div>
        <div class="appbar-right"><span class="channel-tag" data-role-label>频道管理员</span></div>
      </header>

      <section class="page channel-page">
        <section class="channel-sheet">
          <div class="channel-block">
            <span class="channel-kicker">CONTENT REVIEW</span>
            <h1 class="channel-headline"><span data-channel-name>校学生会</span>内容管理</h1>
            <p class="channel-copy">列表必须带正文摘要、媒体、发布者、来源和举报证据。这里只做分流，审核决定一律进入帖子审核详情页。</p>
          </div>
        </section>

        <div class="channel-search">
          <label class="search">
            <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
            <input type="search" data-list-search="#review-case-list" placeholder="搜索标题、作者、举报原因">
          </label>
        </div>

        <section class="channel-sheet">
          <div class="channel-section-head">
            <div>
              <h2>审核队列</h2>
              <p>先判断是否需要进入详情页，不在列表页直接拍板。</p>
            </div>
            <button class="text-action" type="button" data-action-toast="已按最新排序">最新</button>
          </div>
          <div class="channel-row-list" id="review-case-list" data-review-case-list></div>
        </section>
      </section>
    </main>
  </div>
  <script src="campus-native.js"></script>
  <script src="campus-channel-admin-data.js"></script>
  <script>
    (() => {
      const api = window.CampusChannelAdminData;
      const ctx = api?.getContext();
      if (!api || !ctx) return;
      api.applyContext(document, ctx);
      const rows = api.reviewCases.filter((item) => item.channelId === ctx.channelId);
      document.querySelector('[data-review-case-list]').innerHTML = rows.map((item) => `
        <a class="channel-row no-icon" href="campus-post-review.html?channelId=${ctx.channelId}&role=${ctx.roleId}&case=${item.id}" data-searchable>
          <span class="channel-row-main">
            <span class="channel-row-title">${item.title}</span>
            <span class="channel-row-sub">${item.author} · ${item.tags.join(' · ')}</span>
            <span class="channel-row-note">${item.excerpt} 举报说明：${item.report}</span>
          </span>
          <span class="channel-row-tail"><span class="channel-tag ${item.status === '待审核' ? 'warn' : item.status === '举报中' ? 'danger' : 'ok'}">${item.status}</span><svg class="i chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span>
        </a>`).join('');
    })();
  </script>
</body>
</html>
