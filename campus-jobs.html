<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 校园招聘</title>
  <link rel="stylesheet" href="campus-native.css">
  <link rel="stylesheet" href="campus-services.css">
</head>
<body>
  <div class="service-app" data-service-theme="jobs">
    <main>
      <header class="appbar"><div class="appbar-left"><button class="icon-button" data-nav="campus-home.html" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div><div class="appbar-center"><strong>校园招聘</strong></div><div class="appbar-right"><a class="text-link" href="campus-job-publish.html">发布</a></div></header>
      <section class="service-page" data-state-root>
        <div class="service-search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><input data-list-search="#job-list" data-empty-target="#job-empty" placeholder="搜索岗位、单位或地点"></div>
        <div class="service-chipbar" data-service-filter-group data-service-filter-target="#job-list" aria-label="招聘类型"><button class="service-chip active" data-service-filter="all" type="button">全部</button><button class="service-chip" data-service-filter="part" type="button">兼职</button><button class="service-chip" data-service-filter="intern" type="button">实习</button><button class="service-chip" data-service-filter="workstudy" type="button">勤工助学</button><button class="service-chip" data-service-filter="volunteer" type="button">志愿服务</button></div>
        <p class="section-caption">有效岗位</p>
        <div class="service-list" id="job-list">
          <a class="service-list-item" href="campus-job-detail.html" data-searchable data-service-item="part workstudy"><span class="service-list-icon"><svg class="i" viewBox="0 0 24 24"><path d="M5 20V8h14v12M9 8V5h6v3"/></svg></span><span class="service-list-copy"><h2>实验室助理 <em style="margin-left:6px;color:var(--svc-accent);font-style:normal;font-size:14px">¥22/小时</em></h2><p>计算机学院实验中心 · 协助设备管理、登记与现场引导</p><span class="service-list-meta"><span>兼职</span><span>实验楼 A203</span><span>招 2 人</span></span></span><span class="service-list-aside"><span>06-28 截止</span><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span></a>
          <a class="service-list-item" href="campus-job-detail.html" data-searchable data-service-item="volunteer"><span class="service-list-icon"><svg class="i" viewBox="0 0 24 24"><path d="M4 19V5h16v14M8 9h8M8 13h5"/></svg></span><span class="service-list-copy"><h2>校园活动志愿摄影 <em style="margin-left:6px;color:var(--svc-accent);font-style:normal;font-size:14px">志愿时长</em></h2><p>学生会宣传组 · 按活动场次拍摄，提供校园媒体署名</p><span class="service-list-meta"><span>志愿服务</span><span>活动中心</span><span>招 4 人</span></span></span><span class="service-list-aside"><span>07-02 截止</span><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span></a>
          <a class="service-list-item" href="campus-job-detail.html" data-searchable data-service-item="intern"><span class="service-list-icon"><svg class="i" viewBox="0 0 24 24"><path d="M12 3v18M5 10h14"/></svg></span><span class="service-list-copy"><h2>校园新媒体运营实习生 <em style="margin-left:6px;color:var(--svc-accent);font-style:normal;font-size:14px">¥120/天</em></h2><p>学校融媒体中心 · 参与选题、编辑与数据整理</p><span class="service-list-meta"><span>实习</span><span>新闻中心</span><span>招 1 人</span></span></span><span class="service-list-aside"><span>07-05 截止</span><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span></a>
        </div>
        <div class="empty" id="job-empty" hidden><div class="empty-icon"><svg class="i" viewBox="0 0 24 24"><path d="M5 20V8h14v12M9 8V5h6v3"/></svg></div><h3>没有匹配的岗位</h3><p>换个关键词或招聘类型后再试。</p></div>
      </section>
    </main>
  </div>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
  <script src="campus-services.js"></script>
</body>
</html>
