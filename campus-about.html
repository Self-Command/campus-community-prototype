<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 关于我们</title>
  <link rel="stylesheet" href="campus-native.css">
</head>
<body>
  <div class="app-shell" data-tab-scope>
    <main>
      <header class="appbar">
        <div class="appbar-left"><button class="icon-button" data-nav="campus-profile.html" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div>
        <div class="appbar-center"><strong>关于我们</strong></div>
        <div class="appbar-right"></div>
      </header>
      <section class="page">
        <div class="hero-banner">
          <span class="eyebrow" style="background:rgba(255,255,255,.18);color:#fff">Campus Link</span>
          <h2>服务真实校园关系和校内服务流转</h2>
          <p>围绕实名社区、先审后发、频道权限、活动报名/签到、校园服务与消息通知构建。</p>
          <div class="meta-row"><span>版本 0.9.0 MVP</span><span>Android / iOS / 平板</span></div>
        </div>
        <div class="detail-stack space-top-lg">
          <div class="detail-card"><h3>平台原则</h3><p>所有用户生成内容默认纳入审核流程；频道头衔只负责展示，不直接等价于后台权限；活动和校园服务优先保证真实身份和可追溯操作。</p></div>
          <div class="detail-card"><h3>数据与隐私</h3><p>真实姓名、学号/工号、手机号等敏感字段加密存储。联系方式访问会记录日志，并在必要时通知发布者。</p></div>
          <div class="detail-card"><h3>联系与支持</h3><p>如遇审核误判、账号限制或安全问题，可通过“意见反馈”提交工单，后台保留处理过程和状态回执。</p><div class="button-row"><a class="button tertiary" href="campus-feedback.html" style="flex:1">提交反馈</a><a class="button" href="campus-help-center.html" style="flex:1">查看帮助</a></div></div>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
</body>
</html>
