<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 活动列表</title>
  <link rel="stylesheet" href="campus-native.css">
</head>
<body>
  <div class="app-shell" data-tab-scope>
    <main>
      <header class="appbar">
        <div class="appbar-left"><button class="icon-button" data-nav="campus-home.html" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div>
        <div class="appbar-center"><strong>活动列表</strong></div>
        <div class="appbar-right"><a class="text-link" href="campus-publish-activity.html">发布</a></div>
      </header>
      <section class="page">
        <div class="search compact-search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><input placeholder="搜索活动名称、地点、承办方"></div>
        <div class="segmented space-top" data-tab-group><button class="active" data-tab="all">全部</button><button data-tab="registered">我已报名</button><button data-tab="created">我创建的</button></div>
        <section data-tab-panel="all" class="service-board space-top">
          <article class="list-card"><h3>毕业季旧物交换</h3><p>大学生活动中心一楼 · 6 月 28 日 14:00 - 17:00</p><div class="status-row"><span class="tag green">报名中</span><span>144 / 200</span><span>候补 7 人</span></div><div class="button-row"><a class="button tertiary" href="campus-activity-detail.html" style="flex:1">查看详情</a><a class="button" href="campus-activity-signup.html" style="flex:1">立即报名</a></div></article>
          <article class="list-card"><h3>考研经验分享会</h3><p>图书馆报告厅 · 已延期到 7 月 5 日 14:00</p><div class="status-row"><span class="tag amber">已延期</span><span>已自动通知已报名用户</span></div></article>
          <article class="list-card"><h3>校园歌手大赛</h3><p>因场地维修取消。历史记录保留在我的活动中。</p><div class="status-row"><span class="tag red">已取消</span><span>不可再报名</span></div></article>
        </section>
        <section data-tab-panel="registered" hidden class="service-board space-top"><article class="list-card"><h3>毕业季旧物交换</h3><p>当前报名状态：CONFIRMED；签到状态：未开始。</p></article></section>
        <section data-tab-panel="created" hidden class="service-board space-top"><article class="list-card"><h3>摄影社夜拍工作坊</h3><p>你是活动创建者，可查看报名名单、发起签到和延期活动。</p><div class="button-row"><a class="button tertiary" href="campus-activity-manage.html" style="flex:1">进入管理</a></div></article></section>
      </section>
    </main>
  </div>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
</body>
</html>
