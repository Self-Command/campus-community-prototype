<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 待处理详情</title>
  <link rel="stylesheet" href="campus-native.css">
  <link rel="stylesheet" href="campus-channel.css">
</head>
<body>
  <div class="app-shell">
    <main>
      <header class="appbar">
        <div class="appbar-left">
          <button class="icon-button" data-channel-link="campus-channel-applications.html" aria-label="返回">
            <svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          </button>
        </div>
        <div class="appbar-center"><strong>待处理详情</strong></div>
        <div class="appbar-right"><span class="channel-tag" data-ticket-status>待处理</span></div>
      </header>

      <section class="page channel-page">
        <section class="channel-sheet">
          <div class="channel-block">
            <span class="channel-kicker" data-ticket-kind>入群申请</span>
            <h1 class="channel-headline" data-ticket-title>罗雨薇 · 宣传组入群申请</h1>
            <p class="channel-copy" data-ticket-summary>软件工程 2024 级，希望参与迎新活动执行与文案发布。</p>
            <div class="channel-inline-meta">
              <span data-channel-name>校学生会</span>
              <span data-role-label>频道管理员</span>
            </div>
          </div>
        </section>

        <section class="channel-sheet">
          <div class="channel-section-head">
            <div>
              <h2>处理信息</h2>
              <p>先看完整字段，再做通过、拒绝或补充材料的决定。</p>
            </div>
          </div>
          <div class="channel-form" data-ticket-fields></div>
          <p class="channel-note" data-ticket-detail>已完成实名认证，过去无违规记录。申请说明包含过往公众号排版与活动摄影经历。</p>
        </section>

        <section class="channel-sheet">
          <div class="channel-section-head">
            <div>
              <h2>处理原则</h2>
              <p>只展示本次决策必需的信息，避免在列表页堆审批按钮。</p>
            </div>
          </div>
          <div class="channel-row-list">
            <div class="channel-row no-icon">
              <div class="channel-row-main">
                <div class="channel-row-title">记录写入审计</div>
                <div class="channel-row-sub">通过、拒绝或要求补充后，同步写入频道审计和申请人通知。</div>
              </div>
            </div>
            <div class="channel-row no-icon">
              <div class="channel-row-main">
                <div class="channel-row-title">权限边界</div>
                <div class="channel-row-sub">只有当前频道创建者、管理员或平台总管理员能处理；无权限用户不显示操作入口。</div>
              </div>
            </div>
          </div>
        </section>

        <div class="channel-action-bar">
          <button class="button tertiary" type="button" data-ticket-secondary>拒绝并填写原因</button>
          <button class="button" type="button" data-ticket-primary>通过申请</button>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
  <script src="campus-channel-admin-data.js"></script>
  <script>
    (() => {
      const api = window.CampusChannelAdminData;
      const ctx = api?.getContext();
      if (!api || !ctx) return;
      api.applyContext(document, ctx);
      const ticketId = new URLSearchParams(window.location.search).get('ticket') || 'join-1';
      const ticket = api.getTicket(ticketId);
      document.querySelector('[data-ticket-kind]').textContent = ticket.kind;
      document.querySelector('[data-ticket-title]').textContent = ticket.title;
      document.querySelector('[data-ticket-summary]').textContent = ticket.summary;
      document.querySelector('[data-ticket-detail]').textContent = ticket.detail;
      document.querySelector('[data-ticket-status]').textContent = ticket.status;
      document.querySelector('[data-ticket-primary]').textContent = ticket.primary;
      document.querySelector('[data-ticket-secondary]').textContent = ticket.secondary;
      document.querySelector('[data-ticket-primary]').dataset.actionToast = `${ticket.primary}已记录`;
      document.querySelector('[data-ticket-secondary]').dataset.actionToast = `${ticket.secondary}已打开`;
      document.querySelector('[data-ticket-fields]').innerHTML = ticket.fields.map(([label, value]) => `
        <div class="channel-field">
          <label>${label}</label>
          <div>${value}</div>
        </div>`).join('');
    })();
  </script>
</body>
</html>
