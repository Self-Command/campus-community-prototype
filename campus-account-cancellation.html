<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 注销账号</title>
  <link rel="stylesheet" href="campus-native.css">
</head>
<body>
  <div class="app-shell" data-tab-scope>
    <main>
      <header class="appbar">
        <div class="appbar-left"><button class="icon-button" data-nav="campus-account-settings.html" aria-label="返回"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button></div>
        <div class="appbar-center"><strong>注销账号</strong></div>
        <div class="appbar-right"></div>
      </header>
      <section class="page">
        <div class="danger-strip"><svg class="i banner-icon" viewBox="0 0 24 24"><path d="M12 3 3 20h18L12 3Z"/><path d="M12 9v4m0 4h.01"/></svg>提交注销后立即进入 30 天冻结期：无法登录、前台内容不可见，但可在冻结期内撤销。</div>
        <div class="detail-stack space-top">
          <div class="detail-card">
            <h3>注销前检查</h3>
            <div class="checklist" data-gate-group="#cancel-submit">
              <label class="check-item"><input type="checkbox" style="margin-top:3px"><div class="check-body"><strong>我已确认没有未完成的活动管理任务</strong><span>包含已创建活动、待处理候补和签到记录。</span></div></label>
              <label class="check-item"><input type="checkbox" style="margin-top:3px"><div class="check-body"><strong>我已确认草稿和收藏可自行放弃</strong><span>冻结期内不可恢复编辑态。</span></div></label>
              <label class="check-item"><input type="checkbox" style="margin-top:3px"><div class="check-body"><strong>我理解历史公开内容会匿名化保留</strong><span>前台展示为“已注销用户”。</span></div></label>
            </div>
          </div>
          <div class="detail-card">
            <h3>冻结期时间线</h3>
            <div class="timeline">
              <div class="timeline-item"><i></i><div class="timeline-copy"><strong>提交当天</strong><span>账号转为 CANCELLATION_PENDING，前台内容立即下线。</span></div></div>
              <div class="timeline-item"><i></i><div class="timeline-copy"><strong>30 天内</strong><span>可通过原手机号 + 验证码撤销注销，恢复原状态。</span></div></div>
              <div class="timeline-item"><i></i><div class="timeline-copy"><strong>30 天后</strong><span>状态转为 CANCELLED，数据匿名化，不再可登录。</span></div></div>
            </div>
          </div>
          <div class="button-row">
            <button class="button tertiary" type="button" style="flex:1" data-action-toast="已取消本次注销操作">暂不注销</button>
            <button class="button" id="cancel-submit" type="button" style="flex:1;background:#d6455d" disabled data-action-toast="注销申请已提交，进入 30 天冻结期">确认注销</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
</body>
</html>
