<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园社区 · 找回密码</title>
  <link rel="stylesheet" href="campus-native.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-stage">
      <article class="auth-card">
        <span class="eyebrow">安全重置</span>
        <h1 class="auth-title">找回密码</h1>
        <p class="auth-subtitle">通过短信验证码重置密码。新密码不能与用户名或真实姓名相同。</p>
        <form class="inline-grid" data-submit-message="密码已重置，请重新登录" data-success-nav="campus-login.html">
          <div class="split-fields">
            <div class="field"><label>手机号</label><input required inputmode="tel" pattern="^1[3-9]\d{9}$" placeholder="请输入 11 位手机号"></div>
            <div class="field"><label>验证码</label><div class="split-fields" style="grid-template-columns:1fr auto"><input required inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="6 位验证码"><button class="code-button" type="button" data-countdown-seconds="60" data-countdown-label="重新发送">发送验证码</button></div></div>
          </div>
          <div class="split-fields">
            <div class="field input-wrap"><label>新密码</label><input id="reset-password" required type="password" minlength="8" maxlength="128" placeholder="至少 8 位，含大小写和数字"><button class="trailing-button" type="button" data-toggle-password="#reset-password">显示</button></div>
            <div class="field"><label>确认密码</label><input required type="password" data-match="#reset-password" data-match-message="两次输入的新密码不一致" placeholder="再次输入新密码"></div>
          </div>
          <div class="info-strip"><svg class="i banner-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4m0 4h.01"/></svg>验证码 5 分钟有效，连续输错 5 次后需重新发送。</div>
          <button class="button full" type="submit">确认重置</button>
        </form>
      </article>
    </section>
  </main>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
</body>
</html>
