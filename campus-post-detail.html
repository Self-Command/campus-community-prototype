    .detail-business-vote .detail-vote-options { gap: 0; overflow: hidden; margin-top: 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .detail-business-vote .detail-vote-option { min-height: 54px; border: 0; border-radius: 0; border-bottom: 1px solid var(--line); padding: 0 2px; }.detail-business-vote .detail-vote-option:last-child { border-bottom: 0; }.detail-business-vote .detail-vote-option.selected { background: transparent; color: var(--blue); }
    .detail-business-vote .detail-vote-option:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
    .detail-business-vote .detail-vote-radio { width: 18px; height: 18px; }.detail-business-vote .detail-help { margin: 12px 0 16px; }
    .detail-kind-normal_gallery .detail-note-body { padding-top: 20px; }.detail-kind-normal_gallery .detail-body-copy { gap: 12px; }
    .detail-kind-normal_text .detail-note-body { padding-top: 24px; }.detail-kind-normal_text .detail-body-copy p:first-child { font-size: 17px; line-height: 1.82; }
    .detail-kind-normal_gallery .detail-gallery + .detail-note-body h1 { margin-top: 0; }
    .detail-kind-activity .detail-note-body, .detail-kind-vote .detail-note-body { padding-top: 20px; }

<body>
  <div class="detail-screen" data-od-id="post-detail-screen">

      <button class="composer-pill" type="button" data-composer-open>说点什么，参与讨论…</button>
      <button class="composer-icon" type="button" data-composer-open data-tool="voice" aria-label="语音评论"><svg viewBox="0 0 24 24"><path d="M12 4a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V7a3 3 0 0 0-3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="composer-icon" type="button" data-composer-open data-tool="image" aria-label="图片评论"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="m8 15 3-3 2 2 2-3 3 4"/><circle cx="9" cy="9" r="1"/></svg></button>
      <button class="composer-icon" type="button" data-composer-open data-tool="mention" aria-label="艾特同学"><svg viewBox="0 0 24 24"><path d="M16 8v5a3 3 0 1 1-2-2.8V8"/><path d="M16 13a4 4 0 1 0 4 4M12 2a10 10 0 1 0 10 10"/></svg></button>
      <button class="composer-icon" type="button" data-composer-open data-tool="emoji" aria-label="表情"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 10h.01M16 10h.01M8.5 14a5 5 0 0 0 7 0"/></svg></button>
    </div>
  </div>
  <div class="detail-sheet-backdrop" data-sheet-backdrop hidden></div>
  <section class="comment-sheet detail-sheet" data-comment-sheet hidden aria-label="发表评论">
    <div class="detail-sheet-handle"></div>
    <header class="comment-sheet-header"><strong data-composer-title>发表评论</strong><button type="button" data-sheet-close aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <form class="comment-sheet-form" data-detail-composer>
      <textarea required maxlength="500" placeholder="友善表达，最多 500 字" aria-label="评论输入框"></textarea>
      <div class="comment-tool-row" aria-label="评论工具">
        <button class="comment-tool" type="button" data-comment-tool="voice"><svg viewBox="0 0 24 24"><path d="M12 4a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V7a3 3 0 0 0-3-3Z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>语音</span></button>
        <button class="comment-tool" type="button" data-comment-tool="image"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="m8 15 3-3 2 2 2-3 3 4"/><circle cx="9" cy="9" r="1"/></svg><span>图片</span></button>
        <button class="comment-tool" type="button" data-comment-tool="mention"><svg viewBox="0 0 24 24"><path d="M16 8v5a3 3 0 1 1-2-2.8V8"/><path d="M16 13a4 4 0 1 0 4 4M12 2a10 10 0 1 0 10 10"/></svg><span>艾特</span></button>
        <button class="comment-tool" type="button" data-comment-tool="emoji"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 10h.01M16 10h.01M8.5 14a5 5 0 0 0 7 0"/></svg><span>表情</span></button>
        <button class="comment-tool" type="button" data-comment-extra-toggle aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>更多</span></button>
      </div>
      <div class="comment-extra-panel" data-comment-extra-panel hidden>
        <button class="comment-tool" type="button" data-comment-tool="topic"><span>#</span><span>话题</span></button>
        <button class="comment-tool" type="button" data-comment-tool="location"><svg viewBox="0 0 24 24"><path d="M12 21s7-4.6 7-11a7 7 0 1 0-14 0c0 6.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2"/></svg><span>位置</span></button>
        <button class="comment-tool" type="button" data-comment-tool="file"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5"/></svg><span>文件</span></button>
        <button class="comment-tool" type="button" data-comment-tool="anonymous"><svg viewBox="0 0 24 24"><path d="M4 12s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5Z"/><path d="m5 5 14 14"/></svg><span>匿名</span></button>
        <button class="comment-tool" type="button" data-comment-tool="draft"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h6"/></svg><span>草稿</span></button>
      </div>
      <div class="comment-submit-row"><span data-comment-helper>评论会按社区规则审核后展示。</span><button type="submit">发送</button></div>
    </form>
  </section>
  <section class="detail-sheet" data-more-sheet hidden aria-label="更多操作">
    <div class="detail-sheet-handle"></div>
    <header class="detail-sheet-header"><strong>更多操作</strong><button type="button" data-sheet-close aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div class="detail-sheet-body"><div class="detail-sheet-grid">
      <button class="detail-sheet-action" type="button" data-sheet-action="report">举报</button>
      <button class="detail-sheet-action" type="button" data-sheet-action="mute">不看此作者</button>

    </div></div>
  </section>
  <section class="detail-sheet" data-share-sheet hidden aria-label="分享帖子">
    <div class="detail-sheet-handle"></div>
    <header class="detail-sheet-header"><strong>分享</strong><button type="button" data-sheet-close aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div class="detail-sheet-body"><div class="detail-sheet-grid">
      <button class="detail-sheet-action" type="button" data-sheet-action="repost">转发到动态</button>
      <button class="detail-sheet-action" type="button" data-sheet-action="message">私信同学</button>
      <button class="detail-sheet-action" type="button" data-sheet-action="poster">生成海报</button>
      <button class="detail-sheet-action" type="button" data-sheet-action="copy">复制链接</button>
      <button class="detail-sheet-action" type="button" data-sheet-action="system">系统分享</button>

  <section class="media-viewer" data-media-viewer hidden aria-label="媒体查看器">
    <header><button type="button" data-media-close aria-label="关闭媒体"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><strong data-media-title>图片</strong><button type="button" data-detail-share aria-label="分享媒体"><svg viewBox="0 0 24 24"><path d="M14 5h5v5M10 14 19 5M5 19h5v-5"/></svg></button></header>
    <div class="media-stage"><div class="media-stage-inner"><strong data-media-label>媒体内容</strong></div></div>
    <footer><button type="button" data-sheet-action="save-media">保存</button><button type="button" data-sheet-action="mark-media">标记问题</button><button type="button" data-media-close>完成</button></footer>
  </section>
  <div class="toast" data-toast-region role="status" aria-live="polite"></div>
  <script src="campus-native.js"></script>
  <script src="campus-posts.js"></script>
  <script src="campus-post-fixtures.js"></script>
  <script src="campus-post-detail.js"></script>
  <script>
    (() => {
      const mount = document.querySelector('[data-post-detail-mount]');
      const toast = document.querySelector('[data-toast-region]');
      const backdrop = document.querySelector('[data-sheet-backdrop]');
      const commentSheet = document.querySelector('[data-comment-sheet]');
      const moreSheet = document.querySelector('[data-more-sheet]');
      const shareSheet = document.querySelector('[data-share-sheet]');
      const mediaViewer = document.querySelector('[data-media-viewer]');
      const composer = document.querySelector('[data-detail-composer]');
      const composerInput = composer.querySelector('textarea');
      const composerTitle = document.querySelector('[data-composer-title]');
      const composerHelper = document.querySelector('[data-comment-helper]');
      const params = new URLSearchParams(location.search);
      const requestedState = params.get('postState');
      const commentState = params.get('commentState') || 'populated';
      const postId = params.get('postId') || 'spec-student_member-normal_gallery';
      const post = window.CampusPostFixtures?.byId[postId] || window.CampusPosts?.getPostById?.(postId);
      const notify = (message) => { toast.textContent = message; toast.classList.add('show'); clearTimeout(notify.timer); notify.timer = setTimeout(() => toast.classList.remove('show'), 2200); };
      const escapeHtml = (value = '') => String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
      const openSheet = (sheet) => {
        [commentSheet, moreSheet, shareSheet].forEach((item) => { item.hidden = item !== sheet; });
        backdrop.hidden = false;
      };
      const closeSheets = () => {
        [commentSheet, moreSheet, shareSheet].forEach((item) => { item.hidden = true; });
        backdrop.hidden = true;
      };
      const openComposer = (replyTo = '', tool = '') => {
        composerTitle.textContent = replyTo ? `回复 ${replyTo}` : '发表评论';
        if (replyTo) {
          composerInput.value = `@${replyTo} `;
          composerInput.setSelectionRange(composerInput.value.length, composerInput.value.length);
        }
        openSheet(commentSheet);
        if (tool) {
          document.querySelectorAll('[data-comment-tool]').forEach((item) => item.classList.toggle('active', item.dataset.commentTool === tool));
          const labels = { voice: '可录入语音评论，提交前会转为可审核内容。', image: '可附加图片评论，最多 3 张。', mention: '输入 @ 后可选择同学或频道成员。', emoji: '表情面板已打开。' };
          composerHelper.textContent = labels[tool] || '评论会按社区规则审核后展示。';
        }
        window.setTimeout(() => composerInput.focus(), 80);
      };
      const show = () => {
        if (requestedState === 'loading' || requestedState === 'error' || requestedState === 'empty') { mount.innerHTML = window.CampusPostDetail.renderState(requestedState); if (requestedState === 'loading') setTimeout(() => { if (mount.dataset.loading !== 'done') mount.insertAdjacentHTML('beforeend', '<p class="detail-loading-late" role="status">加载时间较长，请检查网络或返回信息流。</p>'); }, 15000); return; }
        mount.dataset.loading = 'done';
        mount.innerHTML = post ? window.CampusPostDetail.renderPostDetail(post, { commentState }) : window.CampusPostDetail.renderState('empty');
      };
      const updateGallery = (gallery, index) => {
        const track = gallery.querySelector('[data-gallery-track]');
        const total = Number(gallery.dataset.galleryCount || 0);
        if (!track || !total) return;
        const nextIndex = Math.max(0, Math.min(total - 1, index));
        gallery.dataset.galleryActive = String(nextIndex);
        const activeSlide = track.querySelector(`[data-gallery-slide][data-gallery-index="${nextIndex}"]`);
        const counter = gallery.querySelector('[data-gallery-counter]');
        const caption = gallery.querySelector('[data-gallery-caption]');
        if (counter) counter.textContent = `${nextIndex + 1} / ${total}`;
        if (caption) caption.textContent = activeSlide?.dataset.mediaLabel || `图片 ${nextIndex + 1}`;
        gallery.querySelectorAll('[data-gallery-dot]').forEach((dot) => {
          const active = Number(dot.dataset.galleryDot) === nextIndex;
          dot.classList.toggle('is-active', active);
          dot.setAttribute('aria-current', String(active));
        });
      };
      const bindGalleries = () => {
        mount.querySelectorAll('[data-gallery]').forEach((gallery) => {
          const track = gallery.querySelector('[data-gallery-track]');
          if (!track || track.dataset.galleryBound === 'true') return;
          track.dataset.galleryBound = 'true';
          updateGallery(gallery, 0);
          track.addEventListener('scroll', () => {
            window.requestAnimationFrame(() => updateGallery(gallery, Math.round(track.scrollLeft / Math.max(track.clientWidth, 1))));
          }, { passive: true });
        });
      };
      show();
      bindGalleries();
      document.addEventListener('click', (event) => {
        if (event.target.closest('[data-sheet-close]') || event.target.closest('[data-sheet-backdrop]')) { closeSheets(); return; }
        const sheetAction = event.target.closest('[data-sheet-action]');
        if (sheetAction) {
          const copy = {
            report: '举报原因面板已打开',
            mute: '后续将减少展示该作者内容',
            copy: '链接已复制',
            author: '已切换为只看作者视图',
            channel: '正在进入来源频道',
            repost: '转发编辑器已打开',
            message: '私信选择器已打开',
            poster: '分享海报正在生成',
            system: '系统分享面板已打开',
            'save-media': '媒体已保存到本地相册',
            'mark-media': '已打开媒体问题标记'
          };
          closeSheets();
          if (sheetAction.dataset.sheetAction === 'channel') { location.href = 'campus-channel-detail.html'; return; }
          if (sheetAction.dataset.sheetAction === 'author' && post) { location.href = window.CampusPostDetail.profileHref(post); return; }
          notify(copy[sheetAction.dataset.sheetAction] || '操作已触发');
          return;
        }
        const composerOpen = event.target.closest('[data-composer-open]');
        if (composerOpen) { openComposer('', composerOpen.dataset.tool || ''); return; }
        const extraToggle = event.target.closest('[data-comment-extra-toggle]');
        if (extraToggle) {
          const panel = document.querySelector('[data-comment-extra-panel]');
          panel.hidden = !panel.hidden;
          extraToggle.setAttribute('aria-expanded', String(!panel.hidden));
          return;
        }
        const commentTool = event.target.closest('[data-comment-tool]');
        if (commentTool) {
          document.querySelectorAll('[data-comment-tool]').forEach((item) => item.classList.toggle('active', item === commentTool));
          const labels = { voice: '语音评论会先转文字再进入审核。', image: '图片评论最多 3 张。', mention: '可搜索同学、教师或频道成员。', emoji: '表情面板已打开。', topic: '可插入一个关联话题。', location: '可附加校内位置。', file: '文件仅支持频道成员可见评论。', anonymous: '匿名评论需频道规则允许。', draft: '已打开评论草稿。' };
          composerHelper.textContent = labels[commentTool.dataset.commentTool] || '评论会按社区规则审核后展示。';
          if (commentTool.dataset.commentTool === 'mention' && !composerInput.value.includes('@')) composerInput.value += '@';
          composerInput.focus();
          return;
        }
        const toggleReplies = event.target.closest('[data-replies-toggle]');
        if (toggleReplies) {
          const open = toggleReplies.dataset.expanded !== 'true';
          toggleReplies.closest('.detail-comment-replies').querySelectorAll('[data-reply-extra]').forEach((reply) => { reply.hidden = !open; });
          toggleReplies.dataset.expanded = String(open);
          toggleReplies.textContent = open ? '收起回复' : toggleReplies.textContent.replace('收起回复', '展开更多回复');
          if (!open) {
            const count = toggleReplies.closest('.detail-comment-replies').querySelectorAll('[data-reply-extra]').length;
            toggleReplies.textContent = `展开 ${count} 条回复`;
          }
          return;
        }
        const collapseThread = event.target.closest('[data-thread-collapse]');
        if (collapseThread) {
          const comment = collapseThread.closest('.detail-comment');
          const collapsed = comment.classList.toggle('is-collapsed');
          collapseThread.textContent = collapsed ? '展开' : '折叠';
          return;
        }
        const commentLike = event.target.closest('[data-comment-like]');
        if (commentLike) {
          const count = commentLike.querySelector('span');
          commentLike.classList.toggle('liked');
          count.textContent = String(Number(count.textContent) + (commentLike.classList.contains('liked') ? 1 : -1));
          return;
        }
        if (event.target.closest('[data-comment-retry]')) { mount.innerHTML = window.CampusPostDetail.renderPostDetail(post, { commentState: 'populated' }); bindGalleries(); return; }
        if (event.target.closest('[data-detail-back]')) { location.href = 'campus-home.html'; return; }
        if (event.target.closest('[data-detail-more]')) { openSheet(moreSheet); return; }
        const galleryControl = event.target.closest('[data-gallery-prev], [data-gallery-next], [data-gallery-dot]');
        if (galleryControl) {
          const gallery = galleryControl.closest('[data-gallery]');
          const track = gallery?.querySelector('[data-gallery-track]');
          if (!gallery || !track) return;
          const current = Number(gallery.dataset.galleryActive || 0);
          const target = galleryControl.hasAttribute('data-gallery-prev') ? current - 1 : galleryControl.hasAttribute('data-gallery-next') ? current + 1 : Number(galleryControl.dataset.galleryDot);
          const total = Number(gallery.dataset.galleryCount || 0);
          const nextIndex = Math.max(0, Math.min(total - 1, target));
          track.scrollTo({ left: track.clientWidth * nextIndex, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
          updateGallery(gallery, nextIndex);
          return;
        }
        const retry = event.target.closest('[data-detail-retry]'); if (retry) { location.href = location.pathname + (post ? `?postId=${encodeURIComponent(post.id)}` : ''); return; }
        const follow = event.target.closest('[data-detail-follow]'); if (follow) { follow.classList.toggle('is-following'); follow.textContent = follow.classList.contains('is-following') ? '已关注' : '关注'; return; }
        const like = event.target.closest('[data-detail-like]'); if (like) { const active = like.classList.toggle('liked'); const count = like.querySelector('[data-detail-like-count]'); if (count) count.textContent = Number(count.textContent) + (active ? 1 : -1); return; }
        const save = event.target.closest('[data-detail-save]'); if (save) { const active = save.classList.toggle('saved'); const count = save.querySelector('[data-detail-save-count]'); if (count) count.textContent = Number(count.textContent) + (active ? 1 : -1); notify(active ? '已收藏' : '已取消收藏'); return; }
        if (event.target.closest('[data-detail-share]')) { mediaViewer.hidden = true; openSheet(shareSheet); return; }
        const media = event.target.closest('[data-detail-media]');
        if (media) {
          const label = media.dataset.mediaLabel || '媒体内容';
          mediaViewer.hidden = false;
          mediaViewer.querySelector('[data-media-label]').textContent = label;
          mediaViewer.querySelector('[data-media-title]').textContent = label;
          return;
        }
        if (event.target.closest('[data-media-close]')) { mediaViewer.hidden = true; return; }
        if (event.target.closest('[data-detail-video]')) { notify('视频播放已开始'); return; }
        if (event.target.closest('[data-detail-link]')) { event.preventDefault(); notify('链接内容会在应用内安全浏览器中打开'); return; }
        if (event.target.closest('[data-detail-signup]')) { location.href = `campus-activity-signup.html?postId=${encodeURIComponent(postId)}`; return; }
        if (event.target.closest('[data-action-sheet="activity"]')) { notify('活动开始前 1 小时提醒已开启'); return; }
        const option = event.target.closest('[data-detail-vote]');
        if (option) {
          const group = option.closest('[data-detail-vote-group]');
          if (group.dataset.voted === 'true') { notify('已投票，当前规则不支持修改'); return; }
          group.querySelectorAll('[data-detail-vote]').forEach((item) => { const selected = item === option; item.classList.toggle('selected', selected); item.setAttribute('aria-pressed', String(selected)); });
          return;
        }
        const voteSubmit = event.target.closest('[data-detail-vote-submit]');
        if (voteSubmit) {
          const group = mount.querySelector('[data-detail-vote-group]');
          const selected = group?.querySelector('[data-detail-vote].selected');
          if (!selected) { notify('请先选择一个选项'); return; }
          group.dataset.voted = 'true'; voteSubmit.disabled = true; voteSubmit.textContent = '已提交投票';
          notify('投票已提交，当前规则不支持修改'); return;
        }
        const reply = event.target.closest('[data-detail-reply]'); if (reply) { openComposer(reply.dataset.detailReplyTo || ''); }
      });
      composer.addEventListener('submit', (event) => {
        event.preventDefault();
        const value = composerInput.value.trim();
        if (!value) return;
        const list = mount.querySelector('[data-comment-list]');
        if (list) {
          list.insertAdjacentHTML('afterbegin', `<article class="detail-comment is-pending"><span class="avatar blue">我</span><div><div class="detail-comment-name"><strong>我</strong><span>刚刚 · 待展示</span></div><p>${escapeHtml(value)}</p><div class="detail-comment-tools"><button type="button" data-comment-like><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.2-7-10a4 4 0 0 1 7-2.7A4 4 0 0 1 19 10c0 5.8-7 10-7 10Z"/></svg><span>0</span></button><button type="button" data-detail-reply data-detail-reply-to="我">回复</button></div></div></article>`);
        }
        notify('评论已提交，完成处理后公开展示');
        composerInput.value = '';
        closeSheets();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          closeSheets();
          mediaViewer.hidden = true;
        }
      });
    })();
  </script>
</body>
</html>
